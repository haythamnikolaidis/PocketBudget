<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Set on THIS page too: without it iOS paints a white background during the
     load, which reads as a broken app next to the dark splash screen. -->
<meta name="theme-color" content="#0f172a">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Offline — PocketBudget</title>
<style>
  /* Standalone on purpose: the network is gone, so an external stylesheet or
     script would be exactly as unavailable as the page that asked for it.
     Colours match app/styles.css and manifest.webmanifest. */
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  main { max-width: 22rem; }
  h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
  p { line-height: 1.5; margin: 0 0 1rem; color: #94a3b8; }
  strong { color: #38bdf8; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>PocketBudget needs a connection to check balances. Your budgets live in a
     Google Sheet, so we can't show you a figure we can't verify — and an
     out-of-date balance would be worse than none.</p>
  <p>Reconnect, then reopen PocketBudget.</p>
</main>
</body>
</html>
