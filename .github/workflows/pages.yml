name: Build, verify, and deploy

# Two jobs:
#   verify  — build the Apps Script bundle, check it, run the full test suite,
#             then publish the bundle as a downloadable artifact. A red suite
#             BLOCKS the deploy, so broken code never reaches users' phones.
#   deploy  — publish app/ to GitHub Pages.
#
# Why the bundle is an artifact: pasting code into the Apps Script editor by
# hand is the single most error-prone step in deployment. The artifact is the
# EXACT file that `verify` compiled and tested — not a rebuild — so what you
# paste is provably the build CI proved loads.
#
# Only app/ is published to Pages. backend/ and tests/ never leave the
# repository, which keeps the data layer out of the public site. The backend
# leaves only as the single bundle file, via the artifact.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once — they would race on the Pages environment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        # No runtime dependencies; npm ci keeps CI honest if that ever changes.
        run: npm ci || npm install

      - name: Build the Apps Script bundle
        run: npm run build

      - name: Reject a bundle containing leftover ES module syntax
        # A stray `import`/`export` means the bundle will not load in Apps
        # Script. grep alone cannot see a broken multi-line import, so also
        # compile-check it below.
        run: |
          if grep -nE '^(import|export)\b|^\} from' backend/Backend.bundle.gs; then
            echo "::error::Backend.bundle.gs still contains module syntax"
            exit 1
          fi

      - name: Compile-check the generated bundle
        run: cp backend/Backend.bundle.gs "$RUNNER_TEMP/bundle.js" && node --check "$RUNNER_TEMP/bundle.js"

      - name: Assert the entry points Apps Script needs are present
        # Without these the deployment 404s at runtime with
        # "Script function not found: doGet".
        run: |
          for fn in doGet doPost dailyRollover setup; do
            grep -qE "^function ${fn}\b" backend/Backend.bundle.gs || {
              echo "::error::Backend.bundle.gs is missing ${fn}()"
              exit 1
            }
          done
          echo "all entry points present"

      - name: Verify the PWA icons
        run: node app/icons/verify-icons.mjs

      - name: Run the test suite
        run: npm test

      - name: Publish the verified bundle
        # Uploaded only after every check above passed, so the artifact is
        # never a build that failed validation.
        uses: actions/upload-artifact@v4
        with:
          name: backend-bundle-${{ github.sha }}
          path: |
            backend/Backend.bundle.gs
            backend/appsscript.json
          retention-days: 90
          if-no-files-found: error

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deployment
        uses: actions/deploy-pages@v4