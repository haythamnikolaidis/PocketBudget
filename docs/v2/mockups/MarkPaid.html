<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mark statement paid</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.scr{position:relative;width:390px;overflow:hidden;background:#0f172a;color:#f1f5f9;font-family:'Manrope',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:14px;line-height:1.4}
.h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-0.01em}
.sub{margin:0;font-size:13px;color:#94a3b8}
.meta{font-size:12px;color:#94a3b8}
.ib{font:inherit;width:44px;height:44px;border-radius:12px;border:1px solid #334155;background:#1e293b;color:#f1f5f9;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.lab{display:block;font-size:12px;font-weight:700;color:#94a3b8;margin:0 0 6px}
.inp{font:inherit;width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid #334155;background:#0b1222;color:#f1f5f9;font-size:16px}
.opt{font:inherit;width:100%;text-align:left;display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#f1f5f9;font-size:14px}
.opt.on{border-color:#10b981;background:rgba(16,185,129,.10)}
.dot{width:18px;height:18px;border-radius:999px;border:2px solid #64748b;flex-shrink:0}
.opt.on .dot{border:5px solid #10b981}
.chip{font:inherit;font-size:13px;font-weight:600;min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid #334155;background:#0f172a;color:#e2e8f0}
.chip.on{background:#10b981;border-color:#10b981;color:#052e1f}
.btn{font:inherit;font-size:16px;font-weight:800;width:100%;min-height:52px;border:0;border-radius:14px;background:#10b981;color:#052e1f}
</style>
</helmet>
<div class="scr" style="height: 844px; padding: 20px 20px 24px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px">
    <button class="ib" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <div>
      <h1 class="h1">Pay Sam's Visa</h1>
      <p class="sub">Statement of 25 Oct · due 15 Nov</p>
    </div>
  </div>

  <div style="margin-top: 18px">
    <label class="lab" for="mp-amt">Amount on the statement</label>
    <input id="mp-amt" class="inp" inputmode="decimal" value="R 4,050.00" style="font-size: 30px; font-weight: 800; min-height: 64px">
  </div>

  <div style="margin-top: 12px; background: #1e293b; border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px 12px; font-size: 13px">
    <span class="meta">Logged in PocketBudget</span><span>R3,980.00</span>
    <span class="meta">On the statement</span><span>R4,050.00</span>
    <span style="font-weight: 700; color: #fcd34d; border-top: 1px solid #334155; padding-top: 6px">Not logged</span><span style="font-weight: 800; color: #fcd34d; border-top: 1px solid #334155; padding-top: 6px">R70.00</span>
  </div>

  <p class="lab" style="margin-top: 16px">What was the R70.00?</p>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <button class="opt"><span class="dot"></span><span style="flex: 1"><strong>Something we forgot to log</strong><span class="meta" style="display: block">Pick the pocket next</span></span></button>
    <button class="opt on"><span class="dot"></span><span style="flex: 1"><strong>Fees or interest</strong><span class="meta" style="display: block">Logged to Bank Fees (R130 left)</span></span></button>
    <button class="opt"><span class="dot"></span><span style="flex: 1"><strong>Leave it</strong><span class="meta" style="display: block">Pockets stay as they are</span></span></button>
  </div>

  <div style="margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
    <span class="lab" style="margin: 0 4px 0 0">Paid</span>
    <button class="chip on">In full</button>
    <button class="chip">Part of it…</button>
    <span class="lab" style="margin: 0 4px 0 10px">from</span>
    <button class="chip">FNB Cheque ▾</button>
  </div>

  <p class="meta" style="margin: 14px 2px 0">Paying the card moves money that your pockets already set aside, so no pocket balance changes.</p>

  <button class="btn" style="margin-top: auto">Record R4,050.00 payment</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
