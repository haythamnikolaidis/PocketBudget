<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accounts and cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.scr{position:relative;width:390px;overflow:hidden;background:#0f172a;color:#f1f5f9;font-family:'Manrope',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:14px;line-height:1.4}
.h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-0.01em}
.meta{font-size:12px;color:#94a3b8}
.ib{font:inherit;width:44px;height:44px;border-radius:12px;border:1px solid #334155;background:#1e293b;color:#f1f5f9;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.acct{border-bottom:1px solid #1e293b;padding:12px 0}
.hd{display:flex;align-items:center;gap:10px}
.seg{display:inline-grid;grid-template-columns:repeat(3,auto);border:1px solid #334155;border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:12px;font-weight:700;min-height:36px;padding:0 10px;border:0;background:#0f172a;color:#94a3b8}
.seg button.on{background:#e2e8f0;color:#0f172a}
.seg button.card.on{background:#60a5fa;color:#0b1a33}
.lab{display:block;font-size:11px;font-weight:700;color:#94a3b8;margin:0 0 4px}
.inp{font:inherit;width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid #334155;background:#0b1222;color:#f1f5f9;font-size:15px}
.btn2{font:inherit;font-size:14px;font-weight:700;width:100%;min-height:48px;border-radius:12px;border:1px dashed #475569;background:none;color:#6ee7b7}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:76px;border-top:1px solid #1e293b;background:#0f172a;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tb{font:inherit;font-size:11px;font-weight:600;background:none;border:0;color:#94a3b8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding-bottom:12px}
.tb.on{color:#6ee7b7}
</style>
</helmet>
<div class="scr" style="height: 844px; padding: 20px 20px 96px">
  <div style="display: flex; align-items: center; gap: 12px">
    <button class="ib" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <h1 class="h1">Accounts &amp; cards</h1>
  </div>

  <div style="margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: rgba(96,165,250,.10); border: 1px solid rgba(96,165,250,.4); font-size: 13px">
    We found <strong>4 accounts</strong> on your pockets. Mark which ones are credit cards so the app can track what's owed.
  </div>

  <div style="margin-top: 6px">
    <div class="acct hd">
      <span style="flex: 1"><strong style="display: block">FNB Cheque</strong><span class="meta">Funds 7 pockets</span></span>
      <span class="seg" role="group" aria-label="FNB Cheque type"><button class="on">Bank</button><button class="card">Card</button><button>Cash</button></span>
    </div>

    <div class="acct">
      <div class="hd">
        <span style="flex: 1"><strong style="display: block">Sam's Visa</strong><span class="meta">Used on 32 expenses</span></span>
        <span class="seg" role="group" aria-label="Sam's Visa type"><button>Bank</button><button class="card on">Card</button><button>Cash</button></span>
      </div>
      <div style="margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div><label class="lab" for="ac-st">Statement day</label><input id="ac-st" class="inp" inputmode="numeric" value="25"></div>
        <div><label class="lab" for="ac-due">Due day</label><input id="ac-due" class="inp" inputmode="numeric" value="15"></div>
        <div><label class="lab" for="ac-lim">Credit limit</label><input id="ac-lim" class="inp" inputmode="decimal" value="30,000"></div>
      </div>
      <p class="meta" style="margin: 6px 0 0">Credit limit is optional. Your pockets are the real limit.</p>
    </div>

    <div class="acct hd">
      <span style="flex: 1"><strong style="display: block">Alex's Mastercard</strong><span class="meta">Statement 20th · due 10th</span></span>
      <span class="seg" role="group" aria-label="Alex's Mastercard type"><button>Bank</button><button class="card on">Card</button><button>Cash</button></span>
    </div>

    <div class="acct hd">
      <span style="flex: 1"><strong style="display: block">Cash</strong><span class="meta">Wallet</span></span>
      <span class="seg" role="group" aria-label="Cash type"><button>Bank</button><button class="card">Card</button><button class="on">Cash</button></span>
    </div>
  </div>

  <button class="btn2" style="margin-top: 14px">+ Add account or card</button>

  <nav class="tabbar" aria-label="Main">
    <button class="tb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>Pockets</button>
    <button class="tb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>Add</button>
    <button class="tb on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Manage</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
