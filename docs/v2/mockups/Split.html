<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Split expense</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.scr{position:relative;width:390px;overflow:hidden;background:#0f172a;color:#f1f5f9;font-family:'Manrope',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:14px;line-height:1.4}
.h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-0.01em}
.meta{font-size:12px;color:#94a3b8}
.lab{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;color:#94a3b8;margin:0 0 6px}
.inp{font:inherit;width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid #334155;background:#0b1222;color:#f1f5f9;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13px;font-weight:600;min-height:40px;padding:6px 12px;border-radius:999px;border:1px dashed #475569;background:#0f172a;color:#e2e8f0;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#60a5fa;border:1px solid #60a5fa;color:#0b1a33}
.line{display:grid;grid-template-columns:minmax(0,1fr) 112px 44px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #1e293b}
.amtin{font:inherit;width:100%;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid #334155;background:#0b1222;color:#f1f5f9;font-size:15px;font-weight:700;text-align:right}
.x{font:inherit;width:44px;height:44px;border-radius:10px;border:0;background:none;color:#94a3b8;display:inline-flex;align-items:center;justify-content:center}
.btn{font:inherit;font-size:16px;font-weight:800;width:100%;min-height:52px;border:0;border-radius:14px;background:#10b981;color:#052e1f}
.lnk{font:inherit;font-size:13px;font-weight:700;background:none;border:0;padding:6px 0;min-height:36px;color:#6ee7b7}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:76px;border-top:1px solid #1e293b;background:#0f172a;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tb{font:inherit;font-size:11px;font-weight:600;background:none;border:0;color:#94a3b8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding-bottom:12px}
.tb.on{color:#6ee7b7}
</style>
</helmet>
<div class="scr" style="height: 844px; padding: 20px 20px 96px">
  <div style="display: flex; align-items: baseline; justify-content: space-between">
    <h1 class="h1">Split an expense</h1>
    <button class="lnk">One pocket</button>
  </div>

  <div style="margin-top: 12px; display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 10px">
    <div>
      <label class="lab" for="sp-amt">Total on the slip</label>
      <input id="sp-amt" class="inp" inputmode="decimal" value="R 1,240.00" style="font-size: 20px; font-weight: 800">
    </div>
    <div>
      <label class="lab" for="sp-note">Store</label>
      <input id="sp-note" class="inp" value="Checkers">
    </div>
  </div>

  <div style="margin-top: 14px">
    <div class="line">
      <span><strong style="display: block">Groceries</strong><span class="meta">R2,880 left</span></span>
      <input class="amtin" aria-label="Amount for Groceries" inputmode="decimal" value="900.00">
      <button class="x" aria-label="Remove Groceries"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div class="line">
      <span><strong style="display: block">Household</strong><span class="meta">R1,350 left</span></span>
      <input class="amtin" aria-label="Amount for Household" inputmode="decimal" value="290.00">
      <button class="x" aria-label="Remove Household"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div class="line">
      <span><strong style="display: block">Gifts</strong><span class="meta">R1,150 left · <span style="color: #6ee7b7">the rest</span></span></span>
      <input class="amtin" aria-label="Amount for Gifts" inputmode="decimal" value="50.00">
      <button class="x" aria-label="Remove Gifts"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
  </div>

  <div style="margin-top: 10px; display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 12px; background: rgba(16,185,129,.12); color: #6ee7b7; font-weight: 700; font-size: 13px">
    <span>All R1,240.00 allocated</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg>
  </div>

  <div style="margin-top: 12px">
    <p class="lab">Add a pocket <span style="font-weight: 600">fills in what's left</span></p>
    <div class="chips">
      <button class="chip">+ Kids</button>
      <button class="chip">+ Dining Out</button>
      <button class="chip">+ Petrol</button>
      <button class="chip">+ More</button>
    </div>
  </div>

  <div style="margin-top: 12px; display: flex; align-items: center; gap: 8px">
    <p class="lab" style="margin: 0 6px 0 0">Paid with</p>
    <button class="chip on" style="min-height: 36px">Sam's Visa</button>
    <button class="chip" style="min-height: 36px; border-style: solid">Change</button>
  </div>

  <button class="btn" style="margin-top: 14px">Save R1,240.00 across 3 pockets</button>

  <nav class="tabbar" aria-label="Main">
    <button class="tb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>Pockets</button>
    <button class="tb on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>Add</button>
    <button class="tb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Manage</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
