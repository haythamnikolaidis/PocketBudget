<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New pocket</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.scr{position:relative;width:390px;overflow:hidden;background:#0f172a;color:#f1f5f9;font-family:'Manrope',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:14px;line-height:1.4}
.h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-0.01em}
.meta{font-size:12px;color:#94a3b8}
.ib{font:inherit;width:44px;height:44px;border-radius:12px;border:1px solid #334155;background:#1e293b;color:#f1f5f9;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.lab{display:block;font-size:12px;font-weight:700;color:#94a3b8;margin:0 0 6px}
.inp{font:inherit;width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid #334155;background:#0b1222;color:#f1f5f9;font-size:16px}
.opt{font:inherit;width:100%;text-align:left;display:flex;align-items:flex-start;gap:12px;min-height:56px;padding:12px 14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#f1f5f9;font-size:14px}
.opt.on{border-color:#10b981;background:rgba(16,185,129,.10)}
.dot{width:18px;height:18px;border-radius:999px;border:2px solid #64748b;flex-shrink:0;margin-top:2px}
.opt.on .dot{border:5px solid #10b981}
.tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:#10b981;color:#052e1f;margin-left:6px}
.sel{font:inherit;font-size:13px;font-weight:700;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid #475569;background:#1e293b;color:#f1f5f9;margin-top:8px}
.btn{font:inherit;font-size:16px;font-weight:800;width:100%;min-height:52px;border:0;border-radius:14px;background:#10b981;color:#052e1f}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:76px;border-top:1px solid #1e293b;background:#0f172a;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tb{font:inherit;font-size:11px;font-weight:600;background:none;border:0;color:#94a3b8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding-bottom:12px}
.tb.on{color:#6ee7b7}
</style>
</helmet>
<div class="scr" style="height: 844px; padding: 20px 20px 96px">
  <div style="display: flex; align-items: center; gap: 12px">
    <button class="ib" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <h1 class="h1">New pocket</h1>
  </div>

  <div style="margin-top: 18px">
    <label class="lab" for="ps-name">Name</label>
    <input id="ps-name" class="inp" value="Holiday">
  </div>
  <div style="margin-top: 12px; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px">
    <div>
      <label class="lab" for="ps-limit">Each month</label>
      <input id="ps-limit" class="inp" inputmode="decimal" value="R 800.00">
    </div>
    <div>
      <label class="lab" for="ps-acct">Funded from</label>
      <select id="ps-acct" class="inp"><option>FNB Cheque</option><option>Cash</option></select>
    </div>
  </div>
  <p class="meta" style="margin: 6px 2px 0">R0 is fine for a pocket that only collects leftovers, like Savings.</p>

  <p class="lab" style="margin-top: 18px">At month end, what's left…</p>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <button class="opt on"><span class="dot"></span><span style="flex: 1"><strong>Carries over</strong><span class="tag">Default</span><span class="meta" style="display: block">Added to next month, no limit on how much builds up. Good for saving towards something.</span></span></button>
    <button class="opt"><span class="dot"></span><span style="flex: 1"><strong>Goes to another pocket</strong><span class="meta" style="display: block">This pocket starts fresh each month.</span><span class="sel" style="display: inline-flex; align-items: center">Savings ▾</span></span></button>
    <button class="opt"><span class="dot"></span><span style="flex: 1"><strong>Resets</strong><span class="meta" style="display: block">Back to R800 on the 1st. Anything left is not kept.</span></span></button>
  </div>

  <button class="btn" style="margin-top: 20px">Create pocket</button>

  <nav class="tabbar" aria-label="Main">
    <button class="tb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>Pockets</button>
    <button class="tb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>Add</button>
    <button class="tb on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Manage</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
